<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">HTL Steyr Hero Background</title>
  <desc id="desc">Abstract geometric background in blue and slate shades for the homepage hero section.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <rect width="1800" height="900" fill="url(#bg)" />
  <circle cx="1460" cy="190" r="270" fill="#22d3ee" fill-opacity="0.12" />
